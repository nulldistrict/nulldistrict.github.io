<!doctype html>
<html lang="{{ .Params.contentLanguage | default site.Language.Locale }}">

<head>
    {{ partial "head.html" . }}
</head>

<body>

    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
        {{ if and (not .IsHome) (not (and .IsPage (eq .Section "posts"))) }}
            {{ partial "support-callout.html" . }}
        {{ end }}
    </main>

    {{ partial "footer.html" . }}
    {{ partial "disablejs.html" . }}

</body>

</html>
